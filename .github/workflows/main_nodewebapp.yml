name: Build and deploy Node.js app to Azure Web App - NodeWebApp
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
        working-directory: ./server
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Zip artifact for deployment
        run: zip -r app.zip .
      - name: Deploy via Kudu Zip Deploy API
        run: |
          curl -X POST -u '${{ secrets.AZURE_WEBAPP_USERNAME }}:${{ secrets.AZURE_WEBAPP_PASSWORD }}' \
            --data-binary @app.zip \
            "https://nodewebapp-eagzawhqachzbccx.scm.centralindia-01.azurewebsites.net/api/zipdeploy"
